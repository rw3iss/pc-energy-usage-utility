[project]
name = "pcenergy"
version = "0.1.0"
description = "Record a Linux PC's energy use (CPU, GPU, estimated rest) and browse it in a terminal UI"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = ["textual>=1.0"]
classifiers = [
    "Environment :: Console",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Monitoring",
]

[project.optional-dependencies]
nvidia = ["nvidia-ml-py>=12"]

[project.scripts]
pcenergy = "pcenergy.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pcenergy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]
